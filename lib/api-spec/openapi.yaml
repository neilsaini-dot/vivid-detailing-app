openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Vivid Detailing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: services
  - name: addons
  - name: pricing
  - name: bookings
  - name: customers
  - name: vehicles
  - name: quotes
  - name: admin
  - name: analytics
  - name: calendar
paths:
  /integrations/ghl/special-bookings:
    post:
      operationId: syncGhlSpecialBooking
      tags: [bookings]
      summary: Import a dedicated GoHighLevel special appointment
      description: Authenticated workflow receiver. Creates or updates one booking per location and appointment. Scheduling belongs to GHL before conversion; app/Google-origin imports and callbacks for app-owned converted bookings are ignored.
      security:
        - GhlSpecialsBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GhlSpecialAppointmentInput"
      responses:
        "200":
          description: Updated, cancelled, duplicate, or ignored delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GhlSpecialSyncResult"
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GhlSpecialSyncResult"
        "400":
          description: Invalid JSON
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Location or calendar is not allowed
        "409":
          description: Conflicting customer identity or completed booking
        "413":
          description: Request exceeds 64 KB
        "422":
          description: Invalid or missing appointment or vehicle fields
        "503":
          description: Receiver configuration or database migration is missing
        "500":
          description: Transaction failed; retry delivery
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Calendar ────────────────────────────────────────────────
  /calendar/availability:
    get:
      operationId: getCalendarAvailability
      tags: [calendar]
      summary: Get available time slots for a given date and service duration
      parameters:
        - name: strict
          in: query
          required: false
          schema:
            type: boolean
            description: Fail rather than claim availability when the calendar cannot be read.
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: "Date in YYYY-MM-DD format"
        - name: duration
          in: query
          required: false
          schema:
            type: number
            description: "Service duration in hours"
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarAvailability"
        "400":
          description: Invalid parameters
        "502":
          description: Failed to fetch from Google Calendar

  /calendar/next-slots:
    get:
      operationId: getCalendarNextSlots
      tags: [calendar]
      summary: Get the next N available booking slots across upcoming days
      parameters:
        - name: strict
          in: query
          required: false
          schema:
            type: boolean
            description: Fail rather than claim availability when the calendar cannot be read.
        - name: duration
          in: query
          required: false
          schema:
            type: number
            description: "Service duration in hours"
        - name: count
          in: query
          required: false
          schema:
            type: number
            description: "Number of slots to return (default 3)"
      responses:
        "200":
          description: Next available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextSlotsResponse"
        "400":
          description: Invalid parameters
        "502":
          description: Failed to fetch from Google Calendar

  # ─── Services ───────────────────────────────────────────────
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all active services
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: goal
          in: query
          description: "Filter by intent goal: clean, protect, tint, paint, quote"
          schema:
            type: string
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/featured:
    get:
      operationId: listFeaturedServices
      tags: [services]
      summary: Featured and seasonal services for the homepage hero
      responses:
        "200":
          description: Featured services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a single service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found

  # ─── Add-ons ─────────────────────────────────────────────────
  /add-ons:
    get:
      operationId: listAddOns
      tags: [addons]
      summary: List all active add-ons
      parameters:
        - name: vehicleType
          in: query
          schema:
            type: string
            enum: [car, suv, truck, van]
        - name: group
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of add-ons with pricing for vehicle type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddOn"

  # ─── Pricing ─────────────────────────────────────────────────
  /pricing/calculate:
    post:
      operationId: calculatePrice
      tags: [pricing]
      summary: Calculate total price for a cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceCalculateBody"
      responses:
        "200":
          description: Price breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceResult"

  # ─── Bookings ─────────────────────────────────────────────────
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update a booking (status, notes, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingBody"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/abandon:
    post:
      operationId: abandonBooking
      tags: [bookings]
      summary: Mark a booking as abandoned (triggers GHL webhook)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lastStep:
                  type: integer
              required: [lastStep]
      responses:
        "200":
          description: Booking abandoned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  # ─── Leads ─────────────────────────────────────────────────────
  /leads:
    post:
      operationId: captureLead
      tags: [customers]
      summary: Capture a partial lead with name and phone only (no email required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureLeadBody"
      responses:
        "201":
          description: Lead saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  # ─── Customers ─────────────────────────────────────────────────
  /customers:
    post:
      operationId: upsertCustomer
      tags: [customers]
      summary: Create or find customer by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCustomerBody"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}/vehicles:
    get:
      operationId: getCustomerVehicles
      tags: [customers]
      summary: Get all vehicles for a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /customers/{id}/bookings:
    get:
      operationId: getCustomerBookings
      tags: [customers]
      summary: Get all bookings for a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /customers/{id}/loyalty:
    get:
      operationId: getCustomerLoyalty
      tags: [customers]
      summary: Get loyalty tier, progress, and lifetime spend
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Loyalty info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyInfo"

  /customers/{id}/dashboard:
    get:
      operationId: getCustomerDashboard
      tags: [customers]
      summary: Full customer dashboard summary (vehicles, bookings, loyalty, condition score)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDashboard"

  # ─── Vehicles ─────────────────────────────────────────────────
  /vehicles:
    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleBody"
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get a vehicle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  # ─── Quotes ─────────────────────────────────────────────────
  /quotes:
    post:
      operationId: createQuoteRequest
      tags: [quotes]
      summary: Submit a quote request (paint correction / PPF / custom)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteBody"
      responses:
        "201":
          description: Quote request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"

  # ─── Admin ─────────────────────────────────────────────────
  /admin/services:
    get:
      operationId: adminListServices
      tags: [admin]
      summary: List all services (including inactive)
      responses:
        "200":
          description: All services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /admin/services/{id}:
    patch:
      operationId: adminUpdateService
      tags: [admin]
      summary: Update service (price, active state, description)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateServiceBody"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /admin/add-ons:
    get:
      operationId: adminListAddOns
      tags: [admin]
      summary: List all add-ons (including inactive)
      responses:
        "200":
          description: All add-ons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddOn"

  /admin/add-ons/{id}:
    patch:
      operationId: adminUpdateAddOn
      tags: [admin]
      summary: Update add-on
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateAddOnBody"
      responses:
        "200":
          description: Updated add-on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddOn"

  /reviews:
    post:
      operationId: submitReview
      tags: [reviews]
      summary: Submit a customer review (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReviewBody"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitReviewResponse"

  /reviews/check:
    get:
      operationId: checkReview
      tags: [reviews]
      summary: Check if a booking already has a review
      parameters:
        - name: bookingId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean

  /admin/reviews:
    get:
      operationId: adminListReviews
      tags: [admin]
      summary: List customer reviews with optional rating filter
      parameters:
        - name: rating
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewWithDetails"

  /bookings/draft:
    post:
      operationId: createBookingDraft
      tags: [bookings]
      summary: Create an incomplete booking draft at step 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingDraftBody"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string

  /bookings/draft/{id}/complete:
    patch:
      operationId: completeBookingDraft
      tags: [bookings]
      summary: Mark draft as completed when booking is submitted
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookingId:
                  type: string
              required: [bookingId]
      responses:
        "200":
          description: Draft marked complete

  /admin/booking-drafts:
    get:
      operationId: adminListBookingDrafts
      tags: [admin]
      summary: List incomplete booking drafts
      responses:
        "200":
          description: List of incomplete drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingDraft"

  /admin/booking-drafts/{id}:
    delete:
      operationId: adminDeleteBookingDraft
      tags: [admin]
      summary: Delete a booking draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /admin/ai-bookings:
    get:
      operationId: adminListAiBookings
      tags: [admin]
      summary: List imported special appointments awaiting review or already converted
      responses:
        "200":
          description: Imported AI bookings with conversion state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiBooking"
        "503":
          description: Conversion tracking migration has not been applied
  /admin/ai-bookings/{id}:
    patch:
      operationId: adminSaveAiBooking
      tags: [admin]
      summary: Save reviewed customer and vehicle details without sending automations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiBookingReviewBody"
      responses:
        "200":
          description: Saved review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiBooking"
        "409":
          description: Booking is no longer editable or conversion is in progress
        "422":
          description: Invalid review details
  /admin/ai-bookings/{id}/convert:
    post:
      operationId: adminConvertAiBooking
      tags: [admin]
      summary: Save reviewed details and send native booking webhook and Google Calendar event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiBookingReviewBody"
      responses:
        "200":
          description: Converted booking or safe repeated conversion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiBooking"
        "409":
          description: Conversion in progress or webhook delivery outcome requires verification
        "422":
          description: Required customer details are incomplete
        "502":
          description: Integration delivery failed; completed steps are retained
        "503":
          description: Conversion tracking migration has not been applied
  /admin/ai-bookings/{id}/verify-webhook:
    post:
      operationId: adminResolveAiBookingWebhook
      tags: [admin]
      summary: Record staff verification of an uncertain webhook delivery before resuming conversion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verifiedInGhl, delivered]
              properties:
                verifiedInGhl:
                  type: boolean
                delivered:
                  type: boolean
      responses:
        "200":
          description: Delivery verification recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiBooking"
        "409":
          description: Conversion is still running
        "422":
          description: Staff must verify the automation history first
  /admin/bookings:
    get:
      operationId: adminListBookings
      tags: [admin]
      summary: List bookings with optional filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, completed, cancelled]
        - name: source
          in: query
          schema:
            type: string
            enum: [online, phone, walkin, referral, other]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: serviceCategory
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Bookings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: adminCreateBooking
      tags: [admin]
      summary: Create a manual booking from the admin panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateBookingBody"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /admin/bookings/{id}:
    patch:
      operationId: adminUpdateBooking
      tags: [admin]
      summary: Update booking (confirm, complete, cancel, condition score, photos)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateBookingBody"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /admin/customers/search:
    get:
      operationId: adminSearchCustomers
      tags: [admin]
      summary: Search customers by name, email, or phone
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching customers with their vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerSearchResult"

  /admin/customers:
    get:
      operationId: adminListCustomers
      tags: [admin]
      summary: List all customers with GHL sync status
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"

  /admin/customers/{id}:
    patch:
      operationId: adminUpdateCustomer
      tags: [admin]
      summary: Update customer profile (condition score, photos, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateCustomerBody"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /admin/analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      summary: Revenue by category + popular add-ons
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsData"

  /admin/seasonal-promos:
    get:
      operationId: listSeasonalPromos
      tags: [admin]
      summary: List seasonal promos
      responses:
        "200":
          description: Promos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeasonalPromo"
    post:
      operationId: createSeasonalPromo
      tags: [admin]
      summary: Create a seasonal promo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeasonalPromoBody"
      responses:
        "201":
          description: Created promo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonalPromo"
    patch:
      operationId: updateSeasonalPromo
      tags: [admin]
      summary: Toggle or edit a seasonal promo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeasonalPromoBody"
      responses:
        "200":
          description: Updated promo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonalPromo"

  /admin/seasonal-promos/{id}:
    delete:
      operationId: deleteSeasonalPromo
      tags: [admin]
      summary: Delete a seasonal promo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /admin/supplies:
    get:
      operationId: adminListSupplies
      tags: [admin]
      summary: List all supplies
      responses:
        "200":
          description: Supplies list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supply"
    post:
      operationId: adminCreateSupply
      tags: [admin]
      summary: Create a supply item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplyBody"
      responses:
        "201":
          description: Created supply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supply"

  /admin/supplies/reorder:
    patch:
      operationId: adminReorderSupplies
      tags: [admin]
      summary: Save a new sort order for supplies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderSuppliesBody"
      responses:
        "204":
          description: Reordered

  /admin/supplies/{id}:
    patch:
      operationId: adminUpdateSupply
      tags: [admin]
      summary: Update a supply item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplyBody"
      responses:
        "200":
          description: Updated supply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supply"
    delete:
      operationId: adminDeleteSupply
      tags: [admin]
      summary: Delete a supply item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /admin/inspections/booking/{bookingId}:
    get:
      operationId: adminGetInspection
      tags: [admin]
      summary: Get inspection for a booking (null if none exists)
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inspection or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
                nullable: true

  /admin/inspections:
    post:
      operationId: adminCreateInspection
      tags: [admin]
      summary: Create (or return existing) inspection for a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInspectionBody"
      responses:
        "201":
          description: Created inspection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"

  /admin/inspections/{id}:
    patch:
      operationId: adminUpdateInspection
      tags: [admin]
      summary: Auto-save inspection data between steps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInspectionBody"
      responses:
        "200":
          description: Updated inspection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"

  /admin/inspections/{id}/complete:
    post:
      operationId: adminCompleteInspection
      tags: [admin]
      summary: Mark inspection complete and set booking to in_progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completed inspection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"

components:
  securitySchemes:
    GhlSpecialsBearer:
      type: http
      scheme: bearer
      description: Shared GHL_SPECIALS_WEBHOOK_SECRET configured on Railway and in the workflow.
  schemas:
    AiBookingReviewBody:
      type: object
      required: [customer, vehicle, notes]
      properties:
        customer:
          type: object
          required: [name, email, phone]
          properties:
            name:
              type: string
              maxLength: 200
            email:
              type: string
              maxLength: 254
            phone:
              type: string
              maxLength: 50
        vehicle:
          type: object
          required: [type, year, make, model, colour]
          properties:
            type:
              type: string
              enum: [car, suv, truck, van]
            year:
              type: integer
              nullable: true
            make:
              type: string
              maxLength: 100
            model:
              type: string
              maxLength: 100
            colour:
              type: string
              maxLength: 100
        notes:
          type: string
          maxLength: 4000
    AiBooking:
      type: object
      required: [id, special, ghlAppointmentId, status, appointmentAt, appointmentEndAt, totalEstimate, customer, vehicle, notes, conversionState, webhookState, calendarEventId, convertedAt, lastError, botOrigin, ghlDeleteState, ghlDeleteError, requiresGhlCleanup]
      properties:
        id:
          type: string
        special:
          type: string
          enum: [ceramic_special, detailing_special]
        ghlAppointmentId:
          type: string
        status:
          type: string
        appointmentAt:
          type: string
          nullable: true
        appointmentEndAt:
          type: string
          nullable: true
        totalEstimate:
          type: number
          nullable: true
        customer:
          type: object
          required: [name, email, phone]
          properties:
            name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
        vehicle:
          type: object
          required: [type, year, make, model, colour]
          properties:
            type:
              type: string
              nullable: true
            year:
              type: integer
              nullable: true
            make:
              type: string
              nullable: true
            model:
              type: string
              nullable: true
            colour:
              type: string
              nullable: true
        notes:
          type: string
          nullable: true
        conversionState:
          type: string
          enum: [review, processing, failed, converted]
        webhookState:
          type: string
          enum: [pending, sending, sent, uncertain]
        calendarEventId:
          type: string
          nullable: true
        convertedAt:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        botOrigin:
          type: string
          nullable: true
          enum: [chat_bot, voice_bot]
        ghlDeleteState:
          type: string
          enum: [pending, deleting, deleted, failed]
        ghlDeleteError:
          type: string
          nullable: true
        requiresGhlCleanup:
          type: boolean
    GhlSpecialAppointmentInput:
      type: object
      description: GHL webhook intake is normalized before validation. Unusable optional customer/vehicle details, source metadata, notes, and eventUpdatedAt are ignored instead of blocking the appointment. Appointment identity, approved calendar, explicit status, and valid start/end times remain mandatory for creation.
      required: [locationId, appointmentId, calendarId, appointmentStatus]
      properties:
        bookingOrigin:
          type: string
          enum: [chat_bot, voice_bot]
          description: Set only by the authenticated chat/voice-bot booking workflow, not a generic appointment or Google-sync workflow.
        source:
          type: string
          enum: [gohighlevel]
        locationId:
          type: string
          minLength: 1
          maxLength: 100
        appointmentId:
          type: string
          minLength: 1
          maxLength: 200
        calendarId:
          type: string
          minLength: 1
          maxLength: 100
        appointmentStatus:
          type: string
          enum: [new, confirmed, cancelled, canceled]
        startTime:
          type: string
          description: ISO 8601 or GHL English month/day AM-PM timestamp, optionally prefixed by a weekday. Explicit ISO offsets are preserved; offset-free and GHL local values use America/Halifax with daylight-saving rules. Ambiguous or nonexistent local DST times require an explicit offset. Required when creating an active booking.
          maxLength: 50
        endTime:
          type: string
          description: ISO 8601 or GHL English month/day AM-PM timestamp, optionally prefixed by a weekday. Explicit ISO offsets are preserved; offset-free and GHL local values use America/Halifax with daylight-saving rules. Ambiguous or nonexistent local DST times require an explicit offset. Required when creating an active booking.
          maxLength: 50
        eventUpdatedAt:
          type: string
          description: Optional source appointment last-updated ISO or GHL English month/day AM-PM timestamp for rejecting out-of-order deliveries. Offset-free and GHL local values use America/Halifax with daylight-saving rules. Must not be a retry's current time.
          maxLength: 50
        contact:
          $ref: "#/components/schemas/GhlSpecialContactInput"
        vehicle:
          $ref: "#/components/schemas/GhlSpecialVehicleInput"
        notes:
          type: ["string", "null"]
          maxLength: 4000
    GhlSpecialContactInput:
      type: object
      description: Contact ID is required for creation. Unusable optional name/email/phone values are ignored; updates preserve existing good values.
      properties:
        id:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 200
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 50
    GhlSpecialVehicleInput:
      type: object
      description: Unusable optional vehicle fields are ignored. Missing or unknown type uses a known existing type or defaults to car; invalid years are omitted rather than inferred.
      properties:
        type:
          type: string
          enum: [car, suv, truck, van, ""]
        year:
          type: [integer, string, "null"]
        make:
          type: string
          maxLength: 100
        model:
          type: string
          maxLength: 100
        colour:
          type: string
          maxLength: 100
    GhlSpecialSyncResult:
      type: object
      required: [success, action, bookingId, special, status, totalEstimate]
      properties:
        success:
          type: boolean
        action:
          type: string
          enum: [created, updated, duplicate, cancelled, ignored]
        bookingId:
          type: ["string", "null"]
        special:
          type: string
          enum: [ceramic_special, detailing_special]
        status:
          type: string
        totalEstimate:
          type: ["number", "null"]
        reason:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Service:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        pricingRule:
          type: string
        basePrice:
          type: number
          nullable: true
        isActive:
          type: boolean
        isSeasonal:
          type: boolean
        sortOrder:
          type: integer
        description:
          type: string
          nullable: true
        includes:
          type: array
          items:
            type: string
        showInProtectionStep:
          type: boolean
        prices:
          type: array
          items:
            $ref: "#/components/schemas/ServicePrice"
      required: [id, name, category, pricingRule, isActive, isSeasonal, sortOrder, showInProtectionStep, includes, prices]

    ServicePrice:
      type: object
      properties:
        vehicleType:
          type: string
        price:
          type: number
      required: [vehicleType, price]

    AddOn:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        categoryGroup:
          type: string
        isActive:
          type: boolean
        showInProtectionStep:
          type: boolean
        sortOrder:
          type: integer
        prices:
          type: array
          items:
            $ref: "#/components/schemas/ServicePrice"
      required: [id, name, categoryGroup, isActive, showInProtectionStep, sortOrder, prices]

    PriceCalculateBody:
