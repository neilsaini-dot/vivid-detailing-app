            type: string
        addOnIds:
          type: array
          items:
            type: string
      required: [vehicleType, serviceIds, addOnIds]

    PriceResult:
      type: object
      properties:
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        subtotal:
          type: number
        tax:
          type: number
        total:
          type: number
        hasQuoteItems:
          type: boolean
      required: [lineItems, subtotal, tax, total, hasQuoteItems]

    LineItem:
      type: object
      properties:
